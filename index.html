<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Soil & Rocks Quiz</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap');

  body {
    font-family: 'Roboto', sans-serif;
    background: linear-gradient(to right, #a8edea, #fed6e3);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
  }

  .quiz-container {
    background: white;
    border-radius: 15px;
    width: 700px;
    max-width: 90%;
    padding: 30px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    animation: fadeIn 1s ease-in-out;
  }

  @keyframes fadeIn {
    from {opacity:0; transform: translateY(-20px);}
    to {opacity:1; transform: translateY(0);}
  }

  h1 {
    text-align: center;
    color: #2b7a78;
    margin-bottom: 20px;
    font-size: 2em;
  }

  .question {
    font-size: 1.2em;
    margin-bottom: 15px;
  }

  .options {
    list-style: none;
    padding: 0;
  }

  .options li {
    background: #def2f1;
    margin-bottom: 10px;
    padding: 10px 15px;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.3s ease;
    border: 2px solid transparent;
  }

  .options li:hover {
    background: #3aafa9;
    color: white;
    transform: translateX(5px);
  }

  .options li.correct {
    background: #57cc99;
    color: white;
    border: 2px solid #2b7a78;
  }

  .options li.wrong {
    background: #ff6b6b;
    color: white;
    border: 2px solid #c92a2a;
  }

  .next-btn {
    margin-top: 20px;
    display: block;
    width: 100%;
    padding: 10px;
    background: #2b7a78;
    color: white;
    font-size: 1.1em;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.3s ease;
  }

  .next-btn:hover {
    background: #3aafa9;
  }

  .progress {
    height: 20px;
    background: #def2f1;
    border-radius: 10px;
    margin-bottom: 20px;
    overflow: hidden;
  }

  .progress-bar {
    height: 100%;
    width: 0%;
    background: #2b7a78;
    border-radius: 10px;
    transition: width 0.5s;
  }

  .timer {
    text-align: right;
    font-size: 1em;
    color: #17252a;
    margin-bottom: 15px;
  }

  .result {
    font-size: 1.3em;
    text-align: center;
    margin-top: 20px;
    color: #17252a;
  }

  .animate {
    animation: bounce 0.6s;
  }

  @keyframes bounce {
    0% {transform: scale(1);}
    50% {transform: scale(1.1);}
    100% {transform: scale(1);}
  }
</style>
</head>
<body>

<div class="quiz-container">
  <h1>Soil & Rocks Quiz</h1>
  <div class="timer">Time Left: <span id="time">20:00</span></div>
  <div class="progress">
    <div class="progress-bar" id="progress-bar"></div>
  </div>
  <div class="question" id="question"></div>
  <ul class="options" id="options"></ul>
  <button class="next-btn" id="next-btn">Next</button>
  <div class="result" id="result"></div>
</div>

<script>
  const quizData = [
    {q:"What is the top layer of soil called?", a:["Topsoil","Subsoil","Bedrock","Humus"], correct:0},
    {q:"Which soil type holds water the best?", a:["Sandy","Clay","Silty","Loam"], correct:1},
    {q:"Which is an Igneous rock?", a:["Granite","Limestone","Slate","Coal"], correct:0},
    {q:"Which layer contains decayed plant and animal matter?", a:["Topsoil","Humus","Bedrock","Subsoil"], correct:1},
    {q:"Which soil is best for most plants?", a:["Clay","Sandy","Loam","Silty"], correct:2},
    {q:"Which type of rock is formed by heat and pressure?", a:["Igneous","Sedimentary","Metamorphic","Obsidian"], correct:2},
    {q:"Which process breaks rocks into smaller pieces?", a:["Erosion","Weathering","Sedimentation","Compaction"], correct:1},
    {q:"Which organisms live in soil?", a:["Worms and bacteria","Snakes","Birds","Fish"], correct:0},
    {q:"What does bedrock form?", a:["Soil","Mountains","The Earth's base","Clay"], correct:2},
    {q:"Which rock type forms from layers pressed together?", a:["Igneous","Sedimentary","Metamorphic","Basalt"], correct:1},
    {q:"Which soil holds nutrients well?", a:["Sandy","Clay","Loam","Silty"], correct:1},
    {q:"Which is NOT a property of rocks?", a:["Color","Hardness","Texture","Temperature"], correct:3},
    {q:"Which soil layer is just above bedrock?", a:["Humus","Subsoil","Topsoil","Clay"], correct:1},
    {q:"Which is a fossil type?", a:["Body Fossil","Topsoil","Basalt","Clay"], correct:0},
    {q:"What process moves sediments to new places?", a:["Weathering","Erosion","Compaction","Melting"], correct:1},
    {q:"Which rock can float on water?", a:["Obsidian","Pumice","Granite","Marble"], correct:1},
    {q:"Which soil type is gritty?", a:["Clay","Silty","Sandy","Loam"], correct:2},
    {q:"Which rock is smooth and was used as a mirror?", a:["Granite","Basalt","Obsidian","Marble"], correct:2},
    {q:"Which rock type contains fossils?", a:["Igneous","Metamorphic","Sedimentary","Obsidian"], correct:2},
    {q:"Which is a major role of soil?", a:["Growing food","Breaking rocks","Forming rivers","Melting lava"], correct:0}
  ];

  let currentQuestion = 0;
  let score = 0;
  const totalQuestions = quizData.length;
  const questionEl = document.getElementById('question');
  const optionsEl = document.getElementById('options');
  const nextBtn = document.getElementById('next-btn');
  const resultEl = document.getElementById('result');
  const progressBar = document.getElementById('progress-bar');
  const timerEl = document.getElementById('time');

  function startTimer(duration) {
    let timer = duration, minutes, seconds;
    const interval = setInterval(() => {
      minutes = parseInt(timer / 60, 10);
      seconds = parseInt(timer % 60, 10);
      minutes = minutes < 10 ? "0"+minutes : minutes;
      seconds = seconds < 10 ? "0"+seconds : seconds;
      timerEl.textContent = minutes + ":" + seconds;
      if (--timer < 0) {
        clearInterval(interval);
        showResult();
      }
    }, 1000);
  }

  function loadQuestion() {
    const q = quizData[currentQuestion];
    questionEl.textContent = q.q;
    optionsEl.innerHTML = '';
    q.a.forEach((opt,i) => {
      const li = document.createElement('li');
      li.textContent = opt;
      li.addEventListener('click', () => selectOption(li, i));
      optionsEl.appendChild(li);
    });
    progressBar.style.width = `${(currentQuestion/totalQuestions)*100}%`;
  }

  function selectOption(li, index) {
    const q = quizData[currentQuestion];
    const lis = optionsEl.querySelectorAll('li');
    lis.forEach(l => l.classList.remove('animate'));
    li.classList.add('animate');
    if(index === q.correct) {
      li.classList.add('correct');
      score++;
    } else {
      li.classList.add('wrong');
      lis[q.correct].classList.add('correct');
    }
    lis.forEach(l => l.style.pointerEvents = 'none');
  }

  nextBtn.addEventListener('click', () => {
    currentQuestion++;
    if(currentQuestion < totalQuestions) {
      loadQuestion();
    } else {
      showResult();
    }
  });

  function showResult() {
    questionEl.style.display = 'none';
    optionsEl.style.display = 'none';
    nextBtn.style.display = 'none';
    progressBar.style.width = '100%';
    resultEl.innerHTML = `You scored ${score} out of ${totalQuestions}! 🎉`;
  }

  loadQuestion();
  startTimer(1200); // 20 mins = 1200 seconds
</script>

</body>
</html>
